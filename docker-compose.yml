version: "3.9"

services:
  db:
    image: postgres:16
    container_name: taskdb
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks

    ports:
      - "5432:5432"

    volumes:
      - taskdata:/var/lib/postgresql/data

  api:
    build: .

    container_name: task-api

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/tasks

    ports:
      - "8000:8000"

volumes:
  taskdata: